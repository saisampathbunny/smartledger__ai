<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartLedger AI - Login</title>
</head>

<body>

    <h1>SmartLedger AI</h1>

    <h2>Login</h2>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <br><br>

        <button type="submit">
            Login
        </button>

    </form>

    <p id="message"></p>

    <p>
        Don't have an account?
        <a href="register.html">
            Register
        </a>
    </p>

    <script>

        document.getElementById("loginForm")
            .addEventListener(
                "submit",
                async function(event)
                {
                    event.preventDefault();

                    const email =
                        document.getElementById(
                            "email"
                        ).value
                            .trim()
                            .toLowerCase();

                    const password =
                        document.getElementById(
                            "password"
                        ).value;

                    const message =
                        document.getElementById(
                            "message"
                        );

                    message.textContent = "";

                    try
                    {
                        const response =
                            await fetch(
                                "http://localhost:8080/auth/login",
                                {
                                    method: "POST",

                                    headers:
                                    {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify(
                                        {
                                            email: email,
                                            password: password
                                        })
                                }
                            );

                        const data =
                            await response.text();

                        if (!response.ok)
                        {
                            throw new Error(
                                data ||
                                "Invalid email or password."
                            );
                        }

                        const result =
                            JSON.parse(data);

                        if (!result.token)
                        {
                            throw new Error(
                                "Login failed."
                            );
                        }

                        localStorage.setItem(
                            "token",
                            result.token
                        );

                        window.location.href =
                            "index.html";
                    }
                    catch (error)
                    {
                        message.textContent =
                            error.message;
                    }
                }
            );

    </script>

</body>

</html>
