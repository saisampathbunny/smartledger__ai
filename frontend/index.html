<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SmartLedger AI</title>

</head>

<body>

    <h1>SmartLedger AI</h1>

    <button onclick="logout()">
        Logout
    </button>

    <hr>

    <h2>Add Transaction</h2>

    <form id="transactionForm">

        <input
            type="text"
            id="senderAccount"
            placeholder="Sender Account"
            required
        >

        <br><br>

        <input
            type="text"
            id="receiverAccount"
            placeholder="Receiver Account"
            required
        >

        <br><br>

        <input
            type="number"
            id="amount"
            placeholder="Amount"
            min="0"
            required
        >

        <br><br>

        <input
            type="text"
            id="transactionType"
            placeholder="Transaction Type"
            required
        >

        <br><br>

        <button type="submit">
            Check Transaction
        </button>

    </form>

    <p id="message"></p>

    <hr>

    <h2>My Transactions</h2>

    <table border="1">

        <thead>

            <tr>

                <th>ID</th>
                <th>Sender</th>
                <th>Receiver</th>
                <th>Amount</th>
                <th>Type</th>
                <th>Status</th>
                <th>Explanation</th>

            </tr>

        </thead>

        <tbody id="transactionTable">

        </tbody>

    </table>

    <script>

        function getToken()
        {
            return localStorage.getItem("token");
        }

        function getHeaders()
        {
            const token = getToken();

            return {
                "Content-Type":
                    "application/json",

                "Authorization":
                    "Bearer " + token
            };
        }

        function checkLogin()
        {
            if (!getToken())
            {
                window.location.href =
                    "login.html";

                return false;
            }

            return true;
        }

        document.getElementById(
            "transactionForm"
        ).addEventListener(
            "submit",
            async function(event)
            {
                event.preventDefault();

                if (!checkLogin())
                {
                    return;
                }

                const transaction =
                {
                    senderAccount:
                        document.getElementById(
                            "senderAccount"
                        ).value,

                    receiverAccount:
                        document.getElementById(
                            "receiverAccount"
                        ).value,

                    amount:
                        Number(
                            document.getElementById(
                                "amount"
                            ).value
                        ),

                    transactionType:
                        document.getElementById(
                            "transactionType"
                        ).value,

                    timestamp:
                        new Date().toISOString()
                };

                try
                {
                    const response =
                        await fetch(
                            "http://localhost:8080/transactions/add",
                            {
                                method: "POST",

                                headers:
                                    getHeaders(),

                                body:
                                    JSON.stringify(
                                        transaction
                                    )
                            }
                        );

                    const data =
                        await response.text();

                    if (response.status === 401)
                    {
                        logout();
                        return;
                    }

                    if (!response.ok)
                    {
                        throw new Error(
                            data ||
                            "Unable to add transaction."
                        );
                    }

                    document.getElementById(
                        "message"
                    ).textContent =
                        "Transaction added.";

                    document.getElementById(
                        "transactionForm"
                    ).reset();

                    loadTransactions();
                }
                catch (error)
                {
                    document.getElementById(
                        "message"
                    ).textContent =
                        error.message;
                }
            }
        );

        async function loadTransactions()
        {
            if (!checkLogin())
            {
                return;
            }

            try
            {
                const response =
                    await fetch(
                        "http://localhost:8080/transactions/all",
                        {
                            method: "GET",
                            headers: getHeaders()
                        }
                    );

                if (response.status === 401)
                {
                    logout();
                    return;
                }

                if (!response.ok)
                {
                    throw new Error(
                        "Unable to load transactions."
                    );
                }

                const transactions =
                    await response.json();

                const table =
                    document.getElementById(
                        "transactionTable"
                    );

                table.innerHTML = "";

                transactions.forEach(
                    function(transaction)
                    {
                        const row =
                            document.createElement(
                                "tr"
                            );

                        addCell(
                            row,
                            transaction.id
                        );

                        addCell(
                            row,
                            transaction.senderAccount
                        );

                        addCell(
                            row,
                            transaction.receiverAccount
                        );

                        addCell(
                            row,
                            transaction.amount
                        );

                        addCell(
                            row,
                            transaction.transactionType
                        );

                        addCell(
                            row,
                            transaction.fraudStatus
                        );

                        addCell(
                            row,
                            transaction.explanation
                        );

                        table.appendChild(row);
                    }
                );
            }
            catch (error)
            {
                document.getElementById(
                    "message"
                ).textContent =
                    error.message;
            }
        }

        function addCell(row, value)
        {
            const cell =
                document.createElement("td");

            cell.textContent =
                value == null
                    ? ""
                    : value;

            row.appendChild(cell);
        }

        function logout()
        {
            localStorage.removeItem("token");

            window.location.href =
                "login.html";
        }

        checkLogin();

        loadTransactions();

    </script>

</body>

</html>
